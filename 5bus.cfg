# STEPSS scenario: 5-bus tutorial system, operating point 1.
# Open it with File > Load configuration in the STEPSS GUI.
# Paths are relative to this file's own directory, so the folder can be
# moved or copied whole.

stepss.format = 1

# System data
data.1 = dyn.dat
data.2 = lf1solv.dat
data.3 = solveroptions.dat
disturbance = nothing.dst
diagram = 5bus.svg

# Observables
observables.file = obs.dat
runtime.1.type = Machine Speed
runtime.1.name = G
runtime.2.type = Bus Voltage
runtime.2.name = 2
runtime.3.type = 
runtime.3.name = 

# Recording
record.trajectory = true
record.continuous = false
record.discrete = false
record.init = true
