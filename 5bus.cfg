# STEPSS scenario. Save configuration wrote this; Load configuration reads it.
# Paths inside this file's own directory are stored relative to it, so the
# folder can be moved or copied whole. Everything else is absolute.
# Scenario: 5-bus tutorial system, operating point 1, undisturbed.

stepss.format = 1

# System data
data.1 = dyn.dat
data.2 = lf1solv.dat
data.3 = solveroptions.dat
disturbance = nothing.dst
diagram = 5bus.svg

# Observables
observables.file = obs.dat
runtime.1.type = Machine Speed
runtime.1.name = G
runtime.2.type = Bus Voltage
runtime.2.name = 2
runtime.3.type = 
runtime.3.name = 

# Recording
record.trajectory = true
record.continuous = false
record.discrete = true
record.init = true
